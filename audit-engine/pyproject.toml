[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-wordpress-audit"
version = "0.2.0"
description = "Authorized WordPress audits with structured evidence and persistent history"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1", "httpcore>=1.0.9,<2", "jinja2>=3.1.6,<4", "openpyxl>=3.1.5,<4", "reportlab>=4.4,<5", "tzdata>=2026.1", "packaging>=25", "ijson>=3.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "mypy>=1.18,<2", "bandit[toml]>=1.8,<2", "pip-audit>=2.9,<3", "pypdf>=6,<7", "PyYAML>=6.0.3,<7", "types-openpyxl", "types-reportlab"]

[project.scripts]
sentinel-audit = "sentinel_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: module interaction", "security: security boundary tests", "e2e: complete controlled workflows", "live: requires explicit live configuration", "wordpress: requires isolated WordPress installation"]

[tool.coverage.run]
source = ["sentinel_audit"]
branch = true
[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sentinel_audit"]
mypy_path = ["src", "typings"]
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
