name: scanwp-ci-fixture
x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: fixture
  WORDPRESS_DB_PASSWORD: fixture-database-only
  WORDPRESS_DB_NAME: scanwp_fixture
  WORDPRESS_CONFIG_EXTRA: |
    define('DISABLE_WP_CRON', true);
    define('DISALLOW_FILE_EDIT', true);
    if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO']) {
      $$_SERVER['HTTPS'] = 'on';
    }
x-wordpress-volumes: &wordpress-volumes
  - wordpress-data:/var/www/html
  - ../wordpress-connector:/var/www/html/wp-content/plugins/scanwp-readonly-connector:ro
  - ./fixtures/active:/var/www/html/wp-content/plugins/scanwp-active:ro
  - ./fixtures/inactive:/var/www/html/wp-content/plugins/scanwp-inactive:ro
  - ./fixtures/mu-fixture.php:/var/www/html/wp-content/mu-plugins/scanwp-fixture.php:ro
services:
  db:
    image: mariadb:11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    environment:
      MARIADB_ROOT_PASSWORD: fixture-root-only
      MARIADB_DATABASE: scanwp_fixture
      MARIADB_USER: fixture
      MARIADB_PASSWORD: fixture-database-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache@sha256:1f59452d2ceed177ad383d17b3a6a7a5c8225d89e34adb36880af8603ac244c2
    depends_on:
      db:
        condition: service_healthy
    environment: *wordpress-environment
    volumes: *wordpress-volumes
    healthcheck:
      test: [CMD, curl, -f, http://localhost/]
      interval: 5s
      timeout: 5s
      retries: 30
  proxy:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - 127.0.0.1:8443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../audit-engine/runtime/wordpress:/etc/nginx/fixture-tls:ro
  wpcli:
    image: wordpress:cli-php8.3@sha256:6bcc7bb91f5157c4b915e74ee131873e99c1c1ff48f602e4a6f6cd17827305cb
    user: '33:33'
    environment:
      <<: *wordpress-environment
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wordpress-volumes
    profiles: [tools]
volumes:
  wordpress-data:
